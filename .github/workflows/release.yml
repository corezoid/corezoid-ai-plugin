name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  full-ci:
    name: Full CI
    uses: ./.github/workflows/ci.yml

  guard:
    name: Pre-release gate (version sync + immutable release)
    needs: full-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Reject an existing release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "ERROR: release $GITHUB_REF_NAME already exists; publish a new immutable version instead."
            exit 1
          fi

      - name: Parse JSON manifests
        run: |
          python3 -m json.tool .claude-plugin/marketplace.json > /dev/null
          python3 -m json.tool .agents/plugins/marketplace.json > /dev/null
          python3 -m json.tool plugins/corezoid/.claude-plugin/plugin.json > /dev/null
          python3 -m json.tool plugins/corezoid/.codex-plugin/plugin.json > /dev/null
          python3 -m json.tool plugins/corezoid/.kiro-plugin/plugin.json > /dev/null
          python3 -m json.tool plugins/corezoid/.mcp.json > /dev/null
          python3 -m json.tool plugins/corezoid/.mcp.kiro.json > /dev/null

      - name: Version sync (six sources + tag match)
        env:
          TAG_REF: ${{ github.ref_name }}
        run: |
          python3 - <<'EOF'
          import json, os, re, sys

          def read_frontmatter_version(path):
              with open(path) as f:
                  text = f.read()
              m = re.match(r"^---\n(.*?)\n---", text, re.DOTALL)
              if not m:
                  raise SystemExit(f"{path}: no YAML frontmatter")
              for line in m.group(1).splitlines():
                  mv = re.match(r"^version:\s*(.+?)\s*$", line)
                  if mv:
                      return mv.group(1).strip().strip('"').strip("'")
              raise SystemExit(f"{path}: no version field in frontmatter")

          with open("plugins/corezoid/.claude-plugin/plugin.json") as f:
              claude_ver = json.load(f)["version"]
          with open("plugins/corezoid/.codex-plugin/plugin.json") as f:
              codex_ver = json.load(f)["version"]
          with open("plugins/corezoid/.kiro-plugin/plugin.json") as f:
              kiro_ver = json.load(f)["version"]
          with open(".claude-plugin/marketplace.json") as f:
              market_ver = json.load(f)["plugins"][0]["version"]
          with open(".agents/plugins/marketplace.json") as f:
              agents_ver = json.load(f)["plugins"][0]["version"]
          power_ver = read_frontmatter_version("POWER.md")

          versions = {
              "claude plugin.json": claude_ver,
              "codex plugin.json": codex_ver,
              "kiro plugin.json": kiro_ver,
              ".claude-plugin/marketplace.json": market_ver,
              ".agents/plugins/marketplace.json": agents_ver,
              "POWER.md": power_ver,
          }
          print("Versions found:", versions)

          if len(set(versions.values())) > 1:
              print("ERROR: version mismatch across manifests")
              for name, ver in versions.items():
                  print(f"  {name}: {ver}")
              sys.exit(1)

          tag = os.environ.get("TAG_REF", "")
          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
              raise SystemExit(f"ERROR: tag {tag!r} is not of the form vX.Y.Z")
          tag_ver = tag[1:]

          if tag_ver != claude_ver:
              print(f"ERROR: tag {tag!r} does not match manifest version {claude_ver!r}")
              sys.exit(1)

          print(f"All six manifests match tag {tag!r}: {claude_ver}")
          EOF

  build-binaries:
    name: Build MCP server binaries
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: plugins/corezoid/mcp-server/go.mod
          cache: true
          cache-dependency-path: plugins/corezoid/mcp-server/go.sum

      - name: Build all platform binaries
        working-directory: plugins/corezoid/mcp-server
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          for GOOS in darwin linux windows; do
            for GOARCH in amd64 arm64; do
              EXT=""
              if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
              CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH \
                go build -ldflags="-s -w -X main.Version=${VERSION} -X main.Commit=${COMMIT}" -o "convctl-${GOOS}-${GOARCH}${EXT}" .
            done
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mcp-binaries
          path: plugins/corezoid/mcp-server/convctl-*

  release:
    name: Create GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          name: mcp-binaries
          path: dist/

      - name: Generate checksums
        working-directory: dist/
        run: sha256sum convctl-* > checksums.txt

      - name: Generate discovery files
        run: python3 scripts/generate-discovery.py

      - name: Attest binary provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/convctl-*

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Pull the section between ## [VERSION] and the next ## heading
          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="See [CHANGELOG.md](CHANGELOG.md) for details."
          fi
          # Write to a file to preserve newlines
          printf '%s\n' "$NOTES" > release_notes.txt

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: "v${{ steps.version.outputs.version }}"
          body_path: release_notes.txt
          draft: false
          prerelease: false
          files: |
            dist/convctl-*
            dist/checksums.txt
            public/llms.txt
            public/.well-known/skills/index.json
            POWER.md

      # A release that publishes without its binaries is not a soft failure: the
      # launcher (run.sh) downloads convctl-<os>-<arch> and checksums.txt from
      # exactly this release, and otherwise falls back to `go run .`, which
      # needs the Go toolchain the README says is not required. So
      # the published asset list is verified against the expected set here, and
      # a release missing anything fails the workflow loudly instead of sitting
      # there looking complete.
      - name: Verify published release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected="convctl-darwin-amd64 convctl-darwin-arm64 \
                    convctl-linux-amd64 convctl-linux-arm64 \
                    convctl-windows-amd64.exe convctl-windows-arm64.exe \
                    checksums.txt llms.txt index.json POWER.md"
          actual=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                     --json assets --jq '.assets[].name')
          echo "Published assets:"; echo "$actual" | sed 's/^/  /'
          missing=""
          for asset in $expected; do
            if ! printf '%s\n' "$actual" | grep -Fxq "$asset"; then
              missing="$missing $asset"
            fi
          done
          if [ -n "$missing" ]; then
            echo "ERROR: release $GITHUB_REF_NAME is missing:$missing"
            echo "The launcher cannot install from this release. Fix the build and publish a new version."
            exit 1
          fi
          echo "All expected assets present."
