name: Claude – issue worker

# Implements a GitHub issue end-to-end, then self-reviews.
# Triggered two ways:
#   1. Automatically when label `ai` is applied to an issue (immediate).
#   2. Manually via workflow_dispatch with an issue number.
#
# Only fires for issues opened in this repository — writes go to a
# TICKET-style branch and end in a PR against main.
#
# Two Claude sessions run back-to-back on the same runner:
#   • Implement — reads the issue, writes code, opens the PR.
#   • Self-review — fresh session, reviews the diff against CLAUDE.md,
#     silently commits fixes to the same branch if issues are found.
#     Posts nothing to the PR when the review is clean.
# After both sessions finish, the PR is tagged with the `ai` label so a
# human reviewer can filter for AI-processed PRs.
#
# Required secrets: ANTHROPIC_API_KEY

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'GitHub issue number'
        required: true
        type: string

jobs:
  implement:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'ai')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Resolve and validate issue number
        id: issue
        env:
          RAW: ${{ inputs.issue_number || github.event.issue.number }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$RAW" | grep -Eq '^[0-9]+$'; then
            echo "Invalid issue number: $RAW"
            exit 1
          fi
          echo "number=$RAW" >> "$GITHUB_OUTPUT"
          echo "branch=ai-issue-$RAW" >> "$GITHUB_OUTPUT"

      - name: Verify the `ai` label was applied by an admin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          set -euo pipefail
          # Latest actor who added the `ai` label to this issue.
          labeler=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/events" \
            --jq '[.[] | select(.event == "labeled" and .label.name == "ai")] | last | .actor.login')
          if [ -z "$labeler" ] || [ "$labeler" = "null" ]; then
            echo "Issue #${ISSUE_NUMBER} has no `ai` label event — refusing to run."
            exit 1
          fi

          perm=$(gh api \
            "repos/${GITHUB_REPOSITORY}/collaborators/${labeler}/permission" \
            --jq '.permission')
          echo "`ai` label on #${ISSUE_NUMBER} applied by ${labeler} (permission: ${perm})"

          if [ "$perm" != "admin" ]; then
            gh issue comment "$ISSUE_NUMBER" --body \
              "AI worker refused to run: only repository admins can apply the \`ai\` label. Latest labeler @${labeler} has \`${perm}\` permission."
            # Strip the label so the scanner does not keep re-dispatching.
            gh issue edit "$ISSUE_NUMBER" --remove-label ai || true
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: plugins/corezoid/mcp-server/go.mod
          cache: true

      - name: Skip if a PR for this issue already exists
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.issue.outputs.branch }}
        run: |
          set -euo pipefail
          if gh pr list --state all --head "$BRANCH" --json number --jq '.[].number' | grep -q .; then
            echo "PR for $BRANCH already exists, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch issue into files
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          set -euo pipefail
          mkdir -p .issue
          gh issue view "$ISSUE_NUMBER" --json number,title,body,labels,author \
            > .issue/raw.json
          jq -r '.title // ""' .issue/raw.json > .issue/title.txt
          jq -r '.body // ""'  .issue/raw.json > .issue/body.txt
          echo "Fetched issue #$ISSUE_NUMBER ($(wc -c < .issue/body.txt) bytes)"

      - name: Implement the issue
        uses: anthropics/claude-code-action@v1
        if: steps.guard.outputs.skip != 'true'
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          BRANCH: ${{ steps.issue.outputs.branch }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            You are implementing GitHub issue #$ISSUE_NUMBER in the
            @corezoid/corezoid-ai-plugin repo.
              Title is at .issue/title.txt, body at .issue/body.txt — read them first.
              Target branch name is in the environment variable BRANCH.

            ## Repo context
            Claude Code / Codex plugin. Ships static skills under
            plugins/corezoid/skills/, four plugin manifests, and a Go MCP server
            `convctl` at plugins/corezoid/mcp-server/. All project-specific rules
            are in CLAUDE.md — obey them.

            ## Steps
            1. Read .issue/title.txt and .issue/body.txt.
            2. `git checkout main && git pull` then `git checkout -b "$BRANCH"`.
            3. Implement the change.
            4. If touching the MCP server:
                 cd plugins/corezoid/mcp-server
                 go build ./... && go vet ./... && go test -race ./...
            5. If adding/removing a skill: update CLAUDE.md and README.md and run
               `python3 scripts/check-skills-sync.py`.
            6. Version bump: if the change is user-visible, bump the version in the
               four manifests (they must all match — see CI check).
            7. `git add <specific files>` and commit with a terse imperative message.
            8. `git push -u origin "$BRANCH"`.
            9. `gh pr create --base main --head "$BRANCH" --title <title> \
                  --body "Closes #$ISSUE_NUMBER\n\n<summary>"` — the `Closes #N`
               keyword auto-links and auto-closes the issue on merge.
          claude_args: |
            --allowedTools "Bash(git:*),Bash(gh:*),Bash(go:*),Bash(python3:*),Bash(npm:*),Bash(node:*),Bash(cd:*),Bash(ls:*),Bash(cat:*),Bash(wc:*),Bash(jq:*),Read,Edit,Write,Glob,Grep"

      - name: Resolve the PR opened by implement step
        id: pr
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.issue.outputs.branch }}
        run: |
          set -euo pipefail
          number=$(gh pr list --state open --head "$BRANCH" \
            --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            echo "Implement step did not open a PR — skipping self-review."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "number=$number" >> "$GITHUB_OUTPUT"
            echo "Found PR #$number for review"
          fi

      - name: Self-review the changes
        uses: anthropics/claude-code-action@v1
        if: steps.guard.outputs.skip != 'true' && steps.pr.outputs.skip != 'true'
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          BRANCH: ${{ steps.issue.outputs.branch }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            You are a senior code reviewer. A previous Claude session just
            implemented issue #$ISSUE_NUMBER on branch $BRANCH and opened
            PR #$PR_NUMBER. Review the diff with fresh eyes — do not trust
            the previous session's judgement.

            This is a SILENT review. Do not comment on the PR, do not
            approve, do not request changes. The only allowed output is
            fix commits to the branch. If everything is fine — do nothing.

            ## Repo context
            @corezoid/corezoid-ai-plugin. Static skills, four plugin manifests,
            and a Go MCP server (`convctl`) at plugins/corezoid/mcp-server/.
            CLAUDE.md holds all project-specific rules.

            ## Steps
            1. `git fetch origin main` and read the diff with
               `git diff origin/main...HEAD`.
            2. Read .issue/title.txt and .issue/body.txt to know the goal.
            3. Review the diff against CLAUDE.md and general quality:
                 - Does the change actually solve the stated issue?
                 - Skills-list sync (CLAUDE.md + README.md ↔ filesystem)?
                 - Manifest versions in the four files still match?
                 - MIT license preserved everywhere?
                 - For MCP server: `cd plugins/corezoid/mcp-server &&
                   go build ./... && go vet ./... && go test -race ./...` still green?
                 - Corezoid process files (*.conv.json) follow rules
                   (24-char hex IDs, extra/extra_type pairing, err_node_id
                   on fallible nodes, no hardcoded constants)?
                 - Any obvious correctness/security issues in the diff itself?
            4. If — and only if — you find real issues, fix them:
                 - Make the corrections directly on the current branch.
                 - Commit each logical fix with message "review: <what>".
                 - `git push origin "$BRANCH"`.
            5. If the review is clean, exit without doing anything.
          claude_args: |
            --allowedTools "Bash(git:*),Bash(go:*),Bash(python3:*),Bash(cd:*),Bash(ls:*),Bash(cat:*),Bash(wc:*),Bash(jq:*),Read,Edit,Write,Glob,Grep"

      - name: Tag PR as AI-processed and dispatch second-line reviewer
        if: steps.guard.outputs.skip != 'true' && steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          # `ai` label on a PR is a visible signal that both sessions
          # (implement + silent self-review) have finished. `issues:`
          # events only fire for issues, so this does NOT re-trigger the
          # worker.
          gh pr edit "$PR_NUMBER" --add-label ai
          # GitHub blocks `pull_request: labeled` triggers when the label
          # was applied by GITHUB_TOKEN — so the pr-reviewer workflow
          # won't fire on its own. Dispatch it explicitly.
          gh workflow run claude-pr-reviewer.yml -f pr_number="$PR_NUMBER"
